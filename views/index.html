<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zainab's Personal Bot</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="card">
    <div class="top-bar">
      <h1>FBISE Activity Bot</h1>
      <a href="#" id="logout-link" class="logout-link">Log out</a>
    </div>
    <p class="subtitle">Ask for a grade/subject activity, or anything else the bot can help with.</p>

    <div class="stack">
      <label for="input-box">Your message</label>
      <textarea id="input-box" placeholder="e.g. Give me a Grade 5 Mathematics real-life activity"></textarea>
      <button id="run-button">Run</button>

      <label for="output">Bot output</label>
      <div id="output"></div>
    </div>
  </main>
  <script src="/chat.js"></script>
</body>
</html>
